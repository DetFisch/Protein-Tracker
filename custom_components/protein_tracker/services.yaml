add_protein:
  name: Add Protein
  description: Add consumed protein directly in grams.
  fields:
    entity_id:
      name: Tracker Sensor Entity
      description: Recommended. Example sensor.jon_protein.
      required: false
      example: sensor.jon_protein
      selector:
        entity:
          domain: sensor
    user_id:
      name: Tracker ID
      description: Optional fallback to target tracker by id.
      required: false
      example: user1
      selector:
        text:
    entry_name:
      name: Entry name
      description: Optional display name for this entry.
      required: false
      example: Breakfast
      selector:
        text:
    grams:
      name: Protein grams
      description: Protein amount in grams.
      required: true
      example: 35
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box

add_food:
  name: Add Food
  description: Add consumed protein by entering food grams and protein per 100g.
  fields:
    entity_id:
      name: Tracker Sensor Entity
      description: Recommended. Example sensor.alex_protein.
      required: false
      example: sensor.alex_protein
      selector:
        entity:
          domain: sensor
    user_id:
      name: Tracker ID
      description: Optional fallback to target tracker by id.
      required: false
      example: user2
      selector:
        text:
    entry_name:
      name: Entry name
      description: Optional display name for this entry.
      required: false
      example: Chicken lunch
      selector:
        text:
    food_grams:
      name: Food grams
      description: How many grams of this food were eaten.
      required: true
      example: 180
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.1
          mode: box
    protein_per_100g:
      name: Protein per 100g
      description: Protein content of the food per 100 grams.
      required: true
      example: 22
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box

add_entry:
  name: Add Entry
  description: Add consumed protein and calories in one entry. Named direct entries are saved as fixed templates. Named entries with food grams and values per 100g are saved as 100g templates. Named entries with food percent and total values are saved as percent templates.
  fields:
    entity_id:
      name: Tracker Entity
      description: Recommended. Example sensor.jon_protein.
      required: false
      example: sensor.jon_protein
      selector:
        entity:
    user_id:
      name: Tracker ID
      description: Optional fallback to target tracker by id.
      required: false
      example: user1
      selector:
        text:
    entry_name:
      name: Entry name
      description: Optional display name for this entry.
      required: false
      example: Breakfast
      selector:
        text:
    update_template:
      name: Update template
      description: Whether a named entry should create or replace its reusable template. Disable this when logging a scaled use of an existing template.
      required: false
      default: true
      selector:
        boolean:
    grams:
      name: Protein grams
      description: Protein amount in grams.
      required: false
      example: 35
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
    calories:
      name: Calories
      description: Calories in kcal.
      required: false
      example: 540
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    servings:
      name: Servings
      description: Optional consumed quantity in pieces for fixed templates.
      required: false
      example: 0.5
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          mode: box
    food_grams:
      name: Food grams
      description: Optional. When supplied with per-100g values, saves a scalable template.
      required: false
      example: 180
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.1
          mode: box
    protein_per_100g:
      name: Protein per 100g
      description: Optional protein content per 100g for scalable templates.
      required: false
      example: 22
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    calories_per_100g:
      name: Calories per 100g
      description: Optional calorie content per 100g for scalable templates.
      required: false
      example: 250
      selector:
        number:
          min: 0
          max: 2000
          step: 0.1
          mode: box
    food_percent:
      name: Food percent
      description: Optional consumed percentage of the whole dish. When supplied with total values, saves a percent template.
      required: false
      example: 33.3
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
    total_protein:
      name: Total protein
      description: Optional protein amount for the whole dish in percent mode.
      required: false
      example: 90
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
    total_calories:
      name: Total calories
      description: Optional calories for the whole dish in percent mode.
      required: false
      example: 2700
      selector:
        number:
          min: 0
          max: 20000
          step: 0.1
          mode: box

set_goal:
  name: Set Goal
  description: Set the daily protein goal.
  fields:
    entity_id:
      name: Tracker Entity
      description: Recommended. Sensor or goal-number entity.
      required: false
      example: sensor.jon_protein
      selector:
        entity:
    user_id:
      name: Tracker ID
      description: Optional fallback to target tracker by id.
      required: false
      example: user1
      selector:
